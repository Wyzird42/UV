; Serial upload is the default env. OTA is a separate env so
; `pio run -t upload` stays a USB flash.

[platformio]
default_envs = esp32dev
; Optional local file for the OTA password. Missing file is fine.
extra_configs = platformio_override.ini

[env:esp32dev]
platform = espressif32 @ 7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200

[env:esp32dev-ota]
extends = env:esp32dev
upload_protocol = espota
; Password is not stored here. Put it in gitignored platformio_override.ini:
;
; [env:esp32dev-ota]
; upload_flags =
;   --auth=your-ota-password
;
; Then: pio run -e esp32dev-ota -t upload --upload-port <board-ip>
